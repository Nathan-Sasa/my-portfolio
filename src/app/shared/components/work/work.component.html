<section
    class="w-full min-h-screen flex flex-col justify-around items-center py-20 lg:py-32">
    <div
        class="flex flex-col justify-center items-center gap-4">
        <h2
            class="max-[321px]:text-xl text-3xl md:text-5xl xl:text-6xl font-bold font-text-accent text-clr-title dark:text-clr-title-dark text-center">
            Ce que j'apporte comme <span class="font-linear-color">travail</span>
        </h2>
        <p
            class="max-[321px]:text-xs md:text-lg text-center dark:text-clr-text-dark px-2 md:px-0 w-full md:w-9/10 md:mt-8 lg:mt-2 lg:w-8/10 xl:w-6/10 font-text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe nesciunt alias culpa vero praesentium corporis explicabo delectus temporibus voluptatum sunt?
        </p>
    </div>
    <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full mt-8 px-4">
        <div 
            *ngFor="let work of works"
            class="flex flex-col items-center gap-4 border border-clr-border-dark/30 dark:border-clr-border-dark/80 rounded-2xl bg-clr-bg-section dark:bg-clr-bg-dark/50 backdrop-blur-sm my-shadow p-4 md:p-6 group dark:hover:bg-clr-dark-card-hover/50 dark:hover:shadow dark:hover:shadow-clr-accent-violet-opacity transition-all duration-200">
            <div class="w-full h-8 flex items-center justify-start">
                <lucide-icon [img]="work.icon" class="text-clr-accent-linear-blue text-2xl group-hover:text-clr-accent-violet-opacity scale-120 groupe-anim transition-all duration-200"  />
            </div>
            <div
                class="w-full flex items-center justify-start">
                <h3 
                    class="text-xl text-clr-title dark:text-clr-title-dark w-full font-text-accent ">
                    {{ work.title }}
                </h3>
            </div>
            <div
                class="w-full h-44">
                <p class="text-left dark:text-clr-text-dark md:text-md font-text font-light">{{ work.text }}</p>
            </div>
        </div>
    </div>
</section>
