<section
    class="w-full min-h-screen py-20 flex flex-col items-center justify-center max-[768px]:px-2.5 max-[769px]:px-4.5 md:px-5 lg:px-7.5 xl:px-8.5 gap-16 bg-clr-bg-section dark:bg-clr-bg-section-dark mt-8"
    >
    <h2
        appScrollAnim
        animType="fade"
        class="max-[321px]:text-xl text-3xl md:text-5xl xl:text-6xl font-bold font-text-accent text-clr-title dark:text-clr-title-dark text-center mb-4"
        >
        Savoir <span class="font-linear-color">plus sur moi</span> et <span class="font-linear-color"> mon parcours</span>
    </h2>

    <div
        class="w-full flex flex-col lg:flex-row relative">
        <div
            class="w-full lg:w-1/2 h-full flex flex-col items-center justify-center relative">
            <div
                class="banner p-1 relative rounded-lg"
                >
                <img 
                    [src]="me.photo" 
                    alt="Nathan dev photo"
                    class="bg-clr-bg dark:bg-clr-bg-dark w-44 object-fill rounded-sm"
                >
            </div>
        </div>
        <div
            class="w-full lg:w-1/2 flex flex-col">

        </div>
    </div>
</section>
