<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>MyPortfolio</title>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/x-icon" href="favicon.ico">

	<!-- Preference theme app  -->
	<script>
		const theme = localStorage.getItem('theme-preference');
		const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

		// Si le thème est explicitement 'dark' ou si c'est 'system' et l'OS est sombre
		if (theme === 'dark' || (theme === 'system' && prefersDark) || (!theme && prefersDark)) {
			document.documentElement.classList.add('dark');
		} else  {
			document.documentElement.classList.remove('dark');
		}
	</script>
</head>
<body
	class="dark:bg-clr-bg-dark bg-clr-bg transition-colors duration-300">
	<app-root></app-root>
</body>
</html>
